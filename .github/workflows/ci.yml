name: CI

on:
  pull_request:
  push:
    branches: [ main ]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: [ "8.3", "8.4", "8.5" ]
        laravel: [ "12", "13" ]
        include:
          - laravel: "12"
            dependency-version: "^12.0"
            testbench-version: "^10.11"
          - laravel: "13"
            dependency-version: "^13.0"
            testbench-version: "^11.0"

    name: checks (PHP ${{ matrix.php }}, Laravel ${{ matrix.laravel }})

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          tools: composer:v2
          coverage: none
          extensions: mbstring, dom, sqlite, pdo_sqlite

      - name: Get Composer cache directory
        id: composer-cache
        run: echo "dir=$(composer config cache-files-dir)" >> $GITHUB_OUTPUT

      - name: Cache Composer dependencies
        uses: actions/cache@v5
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: ${{ runner.os }}-php-${{ matrix.php }}-laravel-${{ matrix.laravel }}-composer-${{ hashFiles('**/composer.lock') }}
          restore-keys: |
            ${{ runner.os }}-php-${{ matrix.php }}-laravel-${{ matrix.laravel }}-composer-

      - name: Install dependencies
        run: |
          composer require \
            illuminate/contracts:${{ matrix.dependency-version }} \
            illuminate/database:${{ matrix.dependency-version }} \
            illuminate/support:${{ matrix.dependency-version }} \
            orchestra/testbench:${{ matrix.testbench-version }} \
            --no-interaction \
            --no-progress \
            --prefer-dist \
            --update-with-all-dependencies

      - name: Validate composer.json
        run: composer validate --strict

      - name: Security audit (Composer)
        run: composer audit --no-interaction

      - name: Coding style (Pint)
        run: vendor/bin/pint --test

      - name: Static analysis (PHPStan/Larastan)
        run: vendor/bin/phpstan analyse

      - name: Tests (Pest)
        run: vendor/bin/pest

  coverage:
    runs-on: ubuntu-latest
    needs: checks
    strategy:
      fail-fast: false
      matrix:
        php: [ "8.3", "8.4", "8.5" ]
        laravel: [ "12", "13" ]
        include:
          - laravel: "12"
            dependency-version: "^12.0"
            testbench-version: "^10.11"
          - laravel: "13"
            dependency-version: "^13.0"
            testbench-version: "^11.0"

    name: coverage (PHP ${{ matrix.php }}, Laravel ${{ matrix.laravel }})

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup PHP (coverage)
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          tools: composer:v2
          coverage: pcov
          extensions: mbstring, dom, sqlite, pdo_sqlite

      - name: Get Composer cache directory
        id: composer-cache
        run: echo "dir=$(composer config cache-files-dir)" >> $GITHUB_OUTPUT

      - name: Cache Composer dependencies
        uses: actions/cache@v5
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: ${{ runner.os }}-php-${{ matrix.php }}-laravel-${{ matrix.laravel }}-coverage-composer-${{ hashFiles('**/composer.lock') }}
          restore-keys: |
            ${{ runner.os }}-php-${{ matrix.php }}-laravel-${{ matrix.laravel }}-coverage-composer-

      - name: Install dependencies
        run: |
          composer require \
            illuminate/contracts:${{ matrix.dependency-version }} \
            illuminate/database:${{ matrix.dependency-version }} \
            illuminate/support:${{ matrix.dependency-version }} \
            orchestra/testbench:${{ matrix.testbench-version }} \
            --no-interaction \
            --no-progress \
            --prefer-dist \
            --update-with-all-dependencies

      - name: Coverage (Pest)
        run: vendor/bin/pest --coverage --coverage-text